<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>화학 연습 문항 — 학생용</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --paper:#F4F7F1; --surface:#FFFFFF; --ink:#16231C; --ink2:#3B4A41;
  --forest:#14532D; --head:#14532D; --lime:#5E8F14; --limebg:#EDF6E0;
  --clay:#B4460F; --claybg:#FCEDE4; --muted:#66766C; --line:#D6E2D0; --line2:#E9F0E5;
  --chip1bg:#FDEAD9; --chip1fg:#9A3412; --chip2bg:#E4F0D6; --chip2fg:#3F6212;
  --shadow:0 1px 2px rgba(20,83,45,.06),0 6px 18px rgba(20,83,45,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F1613; --surface:#18211C; --ink:#E3EAE4; --ink2:#B3C2B8;
  --forest:#8FCB6B; --head:#A7D97F; --lime:#8FCB6B; --limebg:#1B2A19;
  --clay:#E99368; --claybg:#2B1C15; --muted:#8A9A90; --line:#2A3830; --line2:#222E27;
  --chip1bg:#33211A; --chip1fg:#E9A87E; --chip2bg:#1E2C18; --chip2fg:#A7D97F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --paper:#0F1613; --surface:#18211C; --ink:#E3EAE4; --ink2:#B3C2B8;
  --forest:#8FCB6B; --head:#A7D97F; --lime:#8FCB6B; --limebg:#1B2A19;
  --clay:#E99368; --claybg:#2B1C15; --muted:#8A9A90; --line:#2A3830; --line2:#222E27;
  --chip1bg:#33211A; --chip1fg:#E9A87E; --chip2bg:#1E2C18; --chip2fg:#A7D97F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box;}
body{background:var(--paper);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;
     font-size:15px;line-height:1.65;margin:0;}
.wrap{max-width:860px;margin:0 auto;padding-inline:18px;padding-block:0 64px;}
.mono{font-family:'IBM Plex Mono','Consolas',monospace;font-variant-numeric:tabular-nums;}

header{padding-block:34px 14px;}
h1{font-family:'Gowun Batang',serif;font-size:clamp(27px,5vw,38px);font-weight:700;margin:0 0 6px;
   letter-spacing:-.6px;color:var(--head);text-wrap:balance;}
.sub{color:var(--muted);font-size:13.5px;margin:0;}

/* ── 단원 탭 ── */
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--forest);overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;appearance:none;background:transparent;border:0;border-radius:9px 9px 0 0;
     color:var(--muted);font-family:inherit;font-size:14.5px;font-weight:700;padding:10px 18px 9px;
     cursor:pointer;text-align:left;line-height:1.3;}
.tab small{display:block;font-size:11.5px;font-weight:500;letter-spacing:.1px;}
.tab:hover{color:var(--forest);background:var(--line2);}
.tab[aria-selected="true"]{background:var(--forest);color:#fff;}
:root[data-theme="dark"] .tab[aria-selected="true"],:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#0F1613;}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .tab[aria-selected="true"]{color:#fff;}}

.unithead{margin:16px 0 0;}
.unithead .sub{font-size:13px;}

.bar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);
     padding-block:11px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.bar label{font-size:12.5px;color:var(--muted);font-weight:500;}
select,input[type=text]{font-family:inherit;font-size:14px;color:var(--ink);background:var(--surface);
     border:1px solid var(--line);border-radius:7px;padding:7px 10px;max-width:100%;}
select:focus-visible,input:focus-visible,button:focus-visible{outline:2.5px solid var(--lime);outline-offset:2px;}
.prog{flex:1;min-width:150px;display:flex;align-items:center;gap:9px;}
.track{flex:1;height:7px;background:var(--line2);border-radius:99px;overflow:hidden;}
.fill{height:100%;width:0;background:var(--lime);border-radius:99px;transition:width .35s ease;}
.pnum{font-size:13px;color:var(--muted);white-space:nowrap;}
.ulab{font-size:12px;font-weight:700;color:var(--forest);white-space:nowrap;}

h2{font-family:'Gowun Batang',serif;font-size:22px;color:var(--head);margin:38px 0 4px;letter-spacing:-.3px;}
.gsub{color:var(--muted);font-size:13px;margin:0 0 14px;}

.card{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:17px 18px;
      margin-bottom:13px;box-shadow:var(--shadow);border-left:4px solid var(--line);}
.card.ok{border-left-color:var(--lime);}
.card.no{border-left-color:var(--clay);}
.chead{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;margin-bottom:9px;}
.qn{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;color:var(--forest);
    background:var(--chip2bg);padding:2px 8px;border-radius:5px;}
.chip{font-size:11px;font-weight:700;padding:2.5px 8px;border-radius:5px;letter-spacing:.2px;}
.c1{background:var(--chip1bg);color:var(--chip1fg);}
.c2{background:var(--chip2bg);color:var(--chip2fg);}
.q{margin:0 0 12px;}
.qsub{margin:-6px 0 12px;font-size:13.5px;color:var(--ink2);background:var(--line2);border-radius:7px;padding:8px 11px;}
.eqline{background:var(--limebg);border:1px solid var(--line);border-radius:8px;padding:11px 13px;
        margin:10px 0;font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;
        display:flex;gap:7px;align-items:center;flex-wrap:wrap;line-height:2.1;}
.blank{width:62px;text-align:center;padding:5px 6px;font-family:'IBM Plex Mono',monospace;font-weight:600;}
.blank.w{width:88px;}
.inl{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:9px 0;}
.inl .lab{font-size:13.5px;color:var(--ink2);}
.btns{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px;}
button{font-family:inherit;font-size:14px;font-weight:600;border-radius:8px;padding:8px 15px;
       border:1px solid var(--forest);background:var(--forest);color:#fff;cursor:pointer;}
:root[data-theme="dark"] button:not(.tab),:root:not([data-theme="light"]) button:not(.tab){color:#0F1613;}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) button:not(.tab){color:#fff;}}
button.ghost{background:transparent;color:var(--forest);border-color:var(--line);}
.tabs .tab{border:0;}

.fb{margin-top:12px;border-radius:8px;padding:12px 14px;font-size:14px;display:none;}
.fb.show{display:block;}
.fb.good{background:var(--limebg);border:1px solid var(--lime);}
.fb.bad{background:var(--claybg);border:1px solid var(--clay);}
.fb .v{font-weight:700;margin-bottom:5px;display:block;}
.fb.good .v{color:var(--lime);}
.fb.bad .v{color:var(--clay);}
details{margin-top:10px;border-top:1px dashed var(--line);padding-top:9px;}
summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--forest);list-style:none;}
summary::-webkit-details-marker{display:none;}
summary::before{content:"▸ ";}
details[open] summary::before{content:"▾ ";}
ol.steps{margin:9px 0 0;padding-left:20px;font-size:13.5px;color:var(--ink2);}
ol.steps li{margin-bottom:5px;}
.ansrow{font-size:13px;color:var(--muted);margin-top:6px;}

.summary{background:var(--forest);color:#F4F7F1;border-radius:12px;padding:22px;margin-top:34px;}
:root[data-theme="dark"] .summary,:root:not([data-theme="light"]) .summary{background:#1B2A19;color:var(--ink);border:1px solid var(--line);}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .summary{background:var(--forest);color:#F4F7F1;border:0;}}
.summary h3{font-family:'Gowun Batang',serif;margin:0 0 4px;font-size:21px;}
.scores{display:flex;gap:26px;flex-wrap:wrap;margin:14px 0;}
.sc{display:flex;flex-direction:column;}
.sc b{font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:600;line-height:1.15;}
.sc span{font-size:12px;opacity:.8;}
:root .summary button:not(.ghost):not(.tab){background:#F4F7F1;color:#14532D;border-color:#F4F7F1;}
.note{font-size:12.5px;opacity:.85;margin-top:10px;}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);}
@media (max-width:560px){ .blank{width:54px;} .eqline{font-size:14px;} select{width:100%;} .tab{padding:9px 13px 8px;} }
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="wrap">
<header>
  <h1>화학 연습 문항</h1>
  <p class="sub">온세종학교 공동교육과정 화학 · 단원별 형성평가와 정기시험 대비 · 2026학년도 2학기</p>
</header>

<nav class="tabs" id="tabs" role="tablist" aria-label="단원"></nav>
<div class="unithead"><p class="sub" id="usub"></p></div>

<div class="bar">
  <label for="who">이름</label>
  <input type="text" id="who" placeholder="학교와 이름" autocomplete="off" style="width:180px">
  <div class="prog"><span class="ulab" id="ulab"></span><div class="track"><div class="fill" id="fill"></div></div><span class="pnum" id="pnum">0 / 0</span></div>
</div>

<div id="panels"></div>

<div class="summary">
  <h3 id="sTitle">오늘의 결과</h3>
  <p style="margin:0;font-size:13.5px;opacity:.9">틀린 문항은 「개인 학습 노트」 상시 기록 ②에 <b>왜 틀렸는지</b>까지 적으세요.</p>
  <div class="scores">
    <div class="sc"><b id="sScore">0</b><span>맞힌 문항</span></div>
    <div class="sc"><b id="sTried">0</b><span>푼 문항</span></div>
    <div class="sc"><b id="sInteg">0 / 0</b><span>통합과학 연계</span></div>
  </div>
  <div class="btns"><button id="save">결과 코드 만들기</button><button id="reset" class="ghost" style="background:transparent;color:inherit;border-color:rgba(255,255,255,.4)">이 단원 다시 풀기</button></div>
  <div id="codeBox" style="display:none;margin-top:14px">
    <label for="code" style="font-size:12.5px;opacity:.85;display:block;margin-bottom:5px">아래 한 줄을 복사해 클래스룸 과제에 제출하세요</label>
    <textarea id="code" readonly rows="2" style="width:100%;font-family:'IBM Plex Mono',monospace;font-size:13px;
      border-radius:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:inherit;padding:10px;resize:vertical"></textarea>
    <div class="btns"><button id="copy">복사</button></div>
  </div>
  <p class="note" id="saveNote">푼 내용은 이 브라우저에 저장되어, 창을 닫았다 열어도 남아 있습니다.</p>
</div>

<footer>
  <span id="ufoot"></span><br>
  적은 이름과 푼 내용은 <b>이 브라우저에만</b> 저장되며 어디로도 전송되지 않습니다. 제출은 <b>결과 코드</b>를 복사해 클래스룸에 올리는 방식입니다.
</footer>
</div>

<!-- ▼ 단원 문항 파일. 새 단원은 data/unit3.js 를 만들고 아래에 한 줄 추가하면 탭이 생깁니다. -->
<script src="data/unit1.js"></script>
<script src="data/unit2.js"></script>

<script>
const UNITS = window.ONSJ_UNITS || [];
const NAMEKEY = "chem-who", TABKEY = "chem-tab";
const ST = {};                                   // ST[unitId][itemId] = {tried, ok}
UNITS.forEach(u => { ST[u.id] = {}; u.items.forEach(i => ST[u.id][i.id] = {tried:false, ok:false}); });
let cur = UNITS[0] && UNITS[0].id;

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function norm(v){return String(v??"").trim().replace(/\s+/g,"").replace(/,/g,"");}
function same(v,a){
  const n=norm(v); if(!n) return false;
  if(typeof a==="number"){const x=parseFloat(n); return Number.isFinite(x)&&Math.abs(x-a)<1e-6;}
  return n===norm(a);
}
const U  = id => UNITS.find(u => u.id === id);
const EL = (u,it,k) => document.getElementById(u.id+"_"+it.id+"_"+k);

/* ── 그리기 ── */
function inputHTML(u,it,ins,k){
  const id=u.id+"_"+it.id+"_"+k;
  if(ins.t==="sel"){
    const opts=ins.o||ins.opts||it.opts||[];
    return `<select id="${id}" data-u="${u.id}" data-i="${it.id}" data-k="${k}"><option value="">—</option>`+
      opts.map(o=>`<option>${esc(o)}</option>`).join("")+`</select>`;
  }
  return `<input type="text" inputmode="decimal" class="blank${ins.unit?" w":""}" id="${id}" data-u="${u.id}" data-i="${it.id}" data-k="${k}" autocomplete="off">`;
}
function bodyHTML(u,it){
  if(it.eq){
    let h='<div class="eqline">';
    for(let k=0;k<it.eq.length;k++){
      if(it.eq[k]) h+=`<span>${esc(it.eq[k])}</span>`;
      if(k<it.ins.length) h+=inputHTML(u,it,it.ins[k],k);
    }
    return h+'</div>';
  }
  return it.ins.map((ins,k)=>`<div class="inl"><span class="lab">${esc(ins.lab||"")}</span>${inputHTML(u,it,ins,k)}${ins.unit?`<span class="lab">${esc(ins.unit)}</span>`:""}</div>`).join("");
}
(function render(){
  document.getElementById("tabs").innerHTML = UNITS.map(u =>
    `<button class="tab" role="tab" data-tab="${u.id}" aria-selected="false">${esc(u.label)}<small>${esc(u.title)}</small></button>`).join("");
  document.getElementById("panels").innerHTML = UNITS.map(u =>
    `<section id="p_${u.id}" role="tabpanel" hidden>`+
    u.groups.map((g,gi)=>{
      const list=u.items.filter(i=>i.g===gi); if(!list.length) return "";
      const t=typeof g==="string"?g:g.t, s=typeof g==="string"?"":(g.s||"");
      return `<h2>${esc(t)}</h2>${s?`<p class="gsub">${esc(s)}</p>`:""}`+
        list.map(it=>`<div class="card" id="c_${u.id}_${it.id}">
          <div class="chead"><span class="qn">${it.id}</span>
            <span class="chip ${it.tag===1?"c1":"c2"}">${it.tag===1?"통합과학 연계":"화학 Ⅰ"}</span></div>
          <p class="q">${it.q}</p>${it.sub?`<p class="qsub">${it.sub}</p>`:""}${bodyHTML(u,it)}
          <div class="btns"><button data-check="${it.id}" data-u="${u.id}">확인</button></div>
          <div class="fb" id="f_${u.id}_${it.id}"></div></div>`).join("");
    }).join("")+`</section>`).join("");
})();

/* ── 채점 ── */
function check(uid,id,quiet){
  const u=U(uid), it=u.items.find(x=>x.id===id);
  const got=it.ins.map((ins,k)=>EL(u,it,k).value);
  const ok=it.ins.every((ins,k)=>same(got[k],ins.a));
  ST[uid][id]={tried:true,ok};
  const card=document.getElementById("c_"+uid+"_"+id);
  card.classList.toggle("ok",ok); card.classList.toggle("no",!ok);
  const ansList=it.ins.map(ins=>`${ins.lab?esc(ins.lab)+" ":""}<b class="mono">${esc(ins.a)}</b>${ins.unit?" "+esc(ins.unit):""}`).join(" &nbsp;·&nbsp; ");
  const fb=document.getElementById("f_"+uid+"_"+id);
  fb.className="fb show "+(ok?"good":"bad");
  fb.innerHTML=`<span class="v">${ok?"맞았습니다":"다시 보세요"}</span>${it.ex}
    <div class="ansrow">정답 — ${ansList}</div>
    ${it.st?`<details><summary>단계별 풀이 보기</summary><ol class="steps">${it.st.map(s=>`<li>${s}</li>`).join("")}</ol></details>`:""}`;
  if(!quiet){ tally(); persist(uid); }
}
function tally(){
  const u=U(cur); if(!u) return;
  const s=ST[cur], items=u.items;
  const tried=items.filter(i=>s[i.id].tried).length;
  const ok=items.filter(i=>s[i.id].ok).length;
  const integAll=items.filter(i=>i.tag===1).length;
  const integ=items.filter(i=>i.tag===1&&s[i.id].ok).length;
  document.getElementById("sScore").textContent=ok;
  document.getElementById("sTried").textContent=tried;
  document.getElementById("sInteg").textContent=integ+" / "+integAll;
  document.getElementById("pnum").textContent=tried+" / "+items.length;
  document.getElementById("fill").style.width=(items.length?tried/items.length*100:0)+"%";
}

/* ── 탭 ── */
function show(uid){
  const u=U(uid); if(!u) return;
  cur=uid;
  UNITS.forEach(x=>{
    document.getElementById("p_"+x.id).hidden = x.id!==uid;
    document.querySelector(`[data-tab="${x.id}"]`).setAttribute("aria-selected", x.id===uid?"true":"false");
  });
  document.getElementById("usub").textContent=u.sub||"";
  document.getElementById("ulab").textContent=u.label;
  document.getElementById("sTitle").textContent=u.label+" 결과";
  document.getElementById("ufoot").innerHTML=u.foot||"";
  document.getElementById("codeBox").style.display="none";
  note.textContent="푼 내용은 이 브라우저에 저장되어, 창을 닫았다 열어도 남아 있습니다.";
  try{localStorage.setItem(TABKEY,uid);}catch(e){}
  tally();
}

/* ── 저장 (단원별 키 — Ⅰ단원은 기존 페이지 키 그대로) ── */
const who=document.getElementById("who");
const note=document.getElementById("saveNote");
const codeBox=document.getElementById("codeBox"), codeEl=document.getElementById("code");

function persist(uid){
  const u=U(uid);
  try{ localStorage.setItem(u.key||("chem-"+uid), JSON.stringify({who:who.value, state:ST[uid],
    vals:Object.fromEntries(u.items.flatMap(it=>it.ins.map((_,k)=>[it.id+"_"+k,(EL(u,it,k)||{}).value||""])))
  })); }catch(e){}
}
function restore(){
  let name="";
  try{ name=localStorage.getItem(NAMEKEY)||""; }catch(e){}
  UNITS.forEach(u=>{
    let d=null; try{ d=JSON.parse(localStorage.getItem(u.key||("chem-"+u.id))||"null"); }catch(e){}
    if(!d) return;
    if(!name && d.who) name=d.who;
    if(d.vals) for(const [k,v] of Object.entries(d.vals)){ const el=document.getElementById(u.id+"_"+k); if(el) el.value=v; }
    if(d.state) u.items.forEach(it=>{ const s=d.state[it.id]; if(s&&s.tried) check(u.id,it.id,true); });
  });
  who.value=name;
}
function saveName(){
  try{ localStorage.setItem(NAMEKEY, who.value); }catch(e){}
  UNITS.forEach(u=>persist(u.id));
}

/* ── 이벤트 ── */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab]"); if(t){ show(t.dataset.tab); return; }
  const b=e.target.closest("[data-check]"); if(b) check(b.dataset.u,b.dataset.check);
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.matches("input.blank")){e.preventDefault();check(e.target.dataset.u,e.target.dataset.i);}
});
document.addEventListener("change",e=>{ if(e.target.dataset&&e.target.dataset.u) persist(e.target.dataset.u); });
who.addEventListener("input",saveName);

document.getElementById("reset").addEventListener("click",()=>{
  const u=U(cur);
  if(!confirm(u.label+"의 풀이 기록을 지웁니다. 계속할까요?")) return;
  u.items.forEach(it=>{ ST[cur][it.id]={tried:false,ok:false};
    it.ins.forEach((_,k)=>{const el=EL(u,it,k); if(el) el.value="";});
    document.getElementById("c_"+cur+"_"+it.id).classList.remove("ok","no");
    const f=document.getElementById("f_"+cur+"_"+it.id); f.className="fb"; f.innerHTML="";});
  try{localStorage.removeItem(u.key||("chem-"+cur));}catch(e){}
  codeBox.style.display="none"; tally(); window.scrollTo({top:0,behavior:"smooth"});
});
document.getElementById("save").addEventListener("click",()=>{
  const name=who.value.trim();
  if(!name){ note.textContent="먼저 이름을 적으세요."; who.focus(); return; }
  const u=U(cur), s=ST[cur];
  const marks=u.items.map(i=>i.id+(s[i.id].tried?(s[i.id].ok?"O":"X"):"-")).join(" ");
  const ok=u.items.filter(i=>s[i.id].ok).length;
  codeEl.value=(u.codeTag||("화학 "+u.label))+" | "+name+" | "+ok+"/"+u.items.length+" | "+marks;
  codeBox.style.display="block";
  note.textContent="코드를 복사해 클래스룸 과제에 붙여넣으세요. O는 맞힘, X는 틀림, -는 안 푼 문항입니다.";
  codeEl.focus(); codeEl.select();
});
document.getElementById("copy").addEventListener("click",async()=>{
  codeEl.select();
  try{ await navigator.clipboard.writeText(codeEl.value); note.textContent="복사했습니다."; }
  catch(e){ note.textContent="복사가 막혀 있으면, 위 칸을 길게 눌러 직접 복사하세요."; }
});

/* ── 시작 ── */
restore();
let start=cur;
try{ const t=localStorage.getItem(TABKEY); if(t&&U(t)) start=t; }catch(e){}
const q=new URLSearchParams(location.search).get("u"); if(q&&U(q)) start=q;   // ?u=u2 로 특정 단원 바로 열기
show(start);
</script>
</body>
